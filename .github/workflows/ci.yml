name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          save-cache: ${{ github.job == 'backend' }}
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src tests
      - run: uv run pytest -m 'not integration' --cov=fraud_platform --cov-report=term-missing
      - run: uv run fraud-demo --rows 10
      - run: docker compose -f docker-compose.yml -f docker-compose.demo.yml config --quiet
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  kafka:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          save-cache: ${{ github.job == 'backend' }}
      - run: uv sync --locked --extra dev
      - name: Pull Kafka image with bounded retries
        timeout-minutes: 5
        run: bash scripts/ci_retry.sh docker compose pull kafka
      - run: docker compose up --pull never -d --wait kafka
      - run: uv run pytest tests/integration
        env:
          RUN_KAFKA_INTEGRATION: '1'
      - if: always()
        run: docker compose logs kafka
      - if: always()
        run: docker compose down
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          save-cache: ${{ github.job == 'backend' }}
      - run: uv sync --locked --extra dev
      - run: uv run fraud-demo --rows 10
      - name: Pull service images with bounded retries
        timeout-minutes: 5
        run: bash scripts/ci_retry.sh docker compose --parallel 1 -f docker-compose.yml -f docker-compose.demo.yml pull --ignore-buildable
      - name: Build application images with bounded retries
        timeout-minutes: 10
        run: bash scripts/ci_retry.sh docker compose -f docker-compose.yml -f docker-compose.demo.yml build
      - name: Start prepared demo stack
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml up --no-build --pull never -d
      - run: uv run python scripts/smoke_compose.py
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml logs --tail=100
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml down -v
