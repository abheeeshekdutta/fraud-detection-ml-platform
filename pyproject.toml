[project]
name = "fraud-detection-ml-platform"
version = "0.1.0"
description = "Local production-shaped fraud detection ML platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "catboost>=1.2.8",
  "confluent-kafka>=2.8.0",
  "evidently>=0.6.7",
  "fastapi>=0.115.0",
  "lightgbm>=4.5.0",
  "mapie>=0.9.0",
  "mlflow>=2.18.0",
  "numba>=0.60.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "prometheus-client>=0.21.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "scikit-learn>=1.5.0",
  "shap>=0.46.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
fraud-api = "fraud_platform.api:main"
fraud-train = "fraud_platform.training:main"
fraud-replay = "fraud_platform.replay:main"
fraud-consumer = "fraud_platform.consumer:main"
fraud-monitor = "fraud_platform.monitoring:main"
fraud-thresholds = "fraud_platform.threshold_analysis:main"
fraud-calibrate = "fraud_platform.calibration:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires Docker Compose services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
